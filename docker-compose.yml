services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  foundry:
    build: .
    ports:
      - "8000:8000"
    environment:
      - FOUNDRY_OLLAMA_URL=http://ollama:11434
      - FOUNDRY_MODEL=qwen2.5:7b
      - FOUNDRY_DB_PATH=/app/data/foundry.sqlite3
      - FOUNDRY_DECISION_LOG=/app/DECISIONS.jsonl
    volumes:
      - ./data:/app/data
      - ./exports:/app/exports
      - ./DECISIONS.jsonl:/app/DECISIONS.jsonl
    depends_on:
      - ollama

volumes:
  ollama_data:
