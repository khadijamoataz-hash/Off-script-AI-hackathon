services:
  ollama:
    image: ollama/ollama:latest
    # Not published to the host: avoids a port clash if Ollama already runs locally.
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: downloads the open-weight model into the shared volume (several GB on first run,
  # instant afterwards). The app starts without waiting and shows "model still downloading".
  model-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["ollama", "pull", "${FOUNDRY_MODEL:-qwen3.5:9b}"]
    restart: "no"

  # Self-hosted metasearch: gives the agents web search with no API key and no account.
  # Not published to the host.
  searxng:
    image: searxng/searxng:latest
    environment:
      # Session-signing key for a container that is only reachable inside this compose network.
      - SEARXNG_SECRET=${SEARXNG_SECRET:-foundry-local-search-container}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro

  foundry:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Default: the Ollama container. Set FOUNDRY_OLLAMA_URL in .env to use another Ollama,
      # for example one running on the host with GPU access.
      - FOUNDRY_OLLAMA_URL=${FOUNDRY_OLLAMA_URL:-http://ollama:11434}
      - FOUNDRY_MODEL=${FOUNDRY_MODEL:-qwen3.5:9b}
      - FOUNDRY_LLM_PROVIDER=${FOUNDRY_LLM_PROVIDER:-auto}
      - FOUNDRY_THINK=${FOUNDRY_THINK:-0}
      - FOUNDRY_LLM_TIMEOUT=${FOUNDRY_LLM_TIMEOUT:-240}
      - FOUNDRY_NUM_CTX=${FOUNDRY_NUM_CTX:-8192}
      - FOUNDRY_OPENAI_BASE_URL=${FOUNDRY_OPENAI_BASE_URL:-http://ollama:11434/v1}
      - FOUNDRY_OPENAI_API_KEY=${FOUNDRY_OPENAI_API_KEY:-}
      - FOUNDRY_SEARXNG_URL=http://searxng:8080
      - FOUNDRY_DB_PATH=/app/data/foundry.sqlite3
      - FOUNDRY_DECISION_LOG=/app/decision_log.json
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./decision_log.json:/app/decision_log.json
    depends_on:
      ollama:
        condition: service_healthy
      searxng:
        condition: service_started

volumes:
  ollama_data:
