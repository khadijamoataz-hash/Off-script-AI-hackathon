name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Test-only offline provider: no model, no API key, no paid service.
      FOUNDRY_LLM_PROVIDER: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Smoke tests
        run: python -m pytest -q
      - name: Decision log check
        run: python scripts/verify_decision_log.py
